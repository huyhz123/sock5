<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffb74d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="150" cy="150" r="140" fill="url(#logoGradient)" opacity="0.1"/>
  <circle cx="150" cy="150" r="120" fill="none" stroke="url(#logoGradient)" stroke-width="2" opacity="0.3"/>

  <!-- H Letter - Modern Style -->
  <g filter="url(#shadow)">
    <path d="M 60 80 L 60 220 M 60 150 L 120 150 M 120 80 L 120 220"
          stroke="url(#logoGradient)"
          stroke-width="16"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- z Letter - Modern Style -->
  <g filter="url(#shadow)">
    <path d="M 160 170 L 240 170 L 160 210 L 240 210"
          stroke="url(#logoGradient)"
          stroke-width="16"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="260" cy="90" r="10" fill="url(#logoGradient)">
    <animate attributeName="r" values="10;12;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="110" r="6" fill="url(#logoGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="270" cy="110" r="6" fill="url(#logoGradient)" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- Text below -->
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="20" font-weight="bold"
        fill="url(#logoGradient)" text-anchor="middle">
    GSM SERVICES
  </text>
</svg>
